[project]
name = "another-s3-manager"
description = "Lightweight web-based file manager for Amazon S3 buckets built with FastAPI"
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115,<1.0",
    # uvicorn without [standard]: keep only the fast loop/parser. The extra also pulls
    # websockets, watchfiles (dev reload) and PyYAML, none of which ASM uses (ASM-67).
    "uvicorn>=0.30,<1.0",
    "uvloop>=0.19; sys_platform != 'win32'",
    "httptools>=0.6",
    "boto3==1.29.7",
    "python-multipart>=0.0.9",
    # HS256 only: python-jose's native HMAC backend is enough, no cryptography wheel (ASM-67).
    "python-jose==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-dotenv==1.0.0",
    "sqlalchemy>=2.0.30,<3.0",
    "alembic>=1.13.0,<2.0",
    "mcp>=1.2.0,<2.0",
    "prometheus-client>=0.20.0,<1.0",
    "python-json-logger>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.1",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "pytest-mock==3.12.0",
    "httpx==0.27.0",
    "moto[s3]==5.1.2",
    "ruff>=0.8",
    # Enforces the DDD context boundaries ([tool.importlinter] below).
    "import-linter>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
another_s3_manager = ["static/**/*"]

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["another_s3_manager"]

[tool.ruff.lint.per-file-ignores]
# main.py calls configure_logging() before any other import on purpose so the
# root logger is wired up before submodules create their loggers at import time.
"src/another_s3_manager/main.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short"

[tool.coverage.run]
source = ["another_s3_manager"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__",
]
omit = ["tests/*"]

# DDD context boundaries (ASM 1.3.0). See AGENTS.md "Contexts".
[tool.importlinter]
root_package = "another_s3_manager"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "adapters-independent"
name = "Adapters (web, MCP, CLI) do not import each other"
type = "independence"
modules = [
    "another_s3_manager.main",
    "another_s3_manager.mcp_server",
    "another_s3_manager.reset_admin_password",
]
# main is the composition root: it mounts the MCP ASGI app and enters its lifespan.
ignore_imports = ["another_s3_manager.main -> another_s3_manager.mcp_server"]

[[tool.importlinter.contracts]]
id = "access-no-adapters"
name = "Access depends on no adapter, no storage and no web/MCP framework"
type = "forbidden"
source_modules = ["another_s3_manager.access"]
forbidden_modules = [
    "another_s3_manager.main",
    "another_s3_manager.mcp_server",
    "another_s3_manager.reset_admin_password",
    "another_s3_manager.auth",
    "another_s3_manager.s3_client",
    "another_s3_manager.move_jobs",
    "another_s3_manager.move_reservations",
    "fastapi",
    "starlette",
    "mcp",
]
