services:
  minio:
    # Pinned per docker.md "Never use :latest — supply chain risk".
    # Bump together with the matching tag in .github/workflows/ci.yml.
    image: cgr.dev/chainguard/minio@sha256:0dab2f9fee1c1139ae8753b5e35bb4461af2a276cfe0923a2504c75a6170bc64
    container_name: another-s3-manager-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      # The Chainguard image has no curl/wget; probe the port with bash /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-seed:
    image: cgr.dev/chainguard/minio-client@sha256:3c8a8e5c1d88e308f689bd2706984c0095477cd44dcfc5772a5c617074721eaf
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./frontend/tests/e2e/fixtures:/fixtures:ro
      - ./scripts/ci/seed-minio.sh:/seed.sh:ro
    entrypoint: ["/bin/sh", "/seed.sh"]
